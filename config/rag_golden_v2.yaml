# ============================================================================
# SentryAML - RAG 评测问题集 v2（R8c：检验多轮检索 / Agent）
# ============================================================================
# 为什么要 v2：v1 的开发集对"检索一次 vs 多轮检索"已经饱和（R7 只漏 3 道，D61），
# 而 v1 测试集已用于报告、冻结。v2 专门收"检索一次答不好"的题，用来比较 R7、固定两轮、Agent。
#
# 与 v1 相同的字段和规则（rag_golden_check.py 核对）；新增一个字段：
#   pattern  这道题考的是哪种"检索一次答不好"的情形：
#            bridge     答案在被另一条款点名的条款里（"参见第 X 段"）
#            adjacent   答案在已能检索到的条款的相邻条款里
#            paraphrase 提问用业务口语，与条文措辞差距大（含中英配对）
#            two_part   一个问题问两件不同的事
#            cross_doc  需要组合不同文件（或同一文件的正文 + 脚注）
#            version    答案随调查日期变化；含"那一天还没有这条规定"的无答案题
#            premise    问题的前提与条文不符，应纠正前提再回答
#            unanswerable 主题相关、看起来能答，但知识库没有答案
#
# 写题的纪律：
#   1. 所有题在运行任何系统之前写好、核对、切分；运行后发现题目本身有错，只能记录，不能为了结果改题
#   2. gold 尽量选 v1 没用过的条款（rag_golden_check.py 会列出与 v1 重合的条款）
#   3. 避开工具说明里用作示例的编号和主题（D60：示例写成评测题的答案，等于把答案写进提示词）
#   4. 切分按连通分量：共享 gold 条款或 group 的题必须在同一侧
# ============================================================================
