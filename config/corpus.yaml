    jurisdiction: SG
    version_label: "28 March 2024, last revised on 30 June 2025"
    issued_date: 2025-06-30
    effective_from: 2025-07-01
    effective_to: null
    source_url: "https://www.mas.gov.sg/-/media/amld-amendments---30-june-2025/mas-notice-626.pdf"
    download_hint: "直接下载；若链接失效，到 Notice 626 页面找最新的合并版（consolidated）"

  # Guidelines 的版本链：28 Mar 2024（取代 2015 版）→ 18 Oct 2024 修订 → 30 Jun 2025 修订
  # 页面的 Amendment Notes 里写着 "30 Jun 2025: Previous version dated 18 October 2024 is revised"，
  # 所以封面写 "Last revised on 18 October 2024" 的那份是【上一版】，不是最新版。
  - doc_id: mas_n626_guidelines_2024
    family: mas_n626_guidelines
    title: "Guidelines to MAS Notice 626 on Prevention of Money Laundering and Countering the Financing of Terrorism - Banks"
    issuer: MAS
    doc_type: guidelines
    jurisdiction: SG
    version_label: "28 March 2024, last revised on 18 October 2024"
    issued_date: 2024-10-18
    effective_from: 2024-10-18
    effective_to: 2025-07-01          # 被 2025 年 6 月 30 日的修订版取代
    source_url: "https://www.mas.gov.sg/regulation/guidelines/guidelines-to-notice-626-on-prevention-of-money-laundering-and-cft-for-banks"
    download_hint: "Amendment Notes 里 'Previous version dated 18 October 2024' 那个链接（就是你已经下载的那份）"
    optional: true                    # 用来演示版本切换

  - doc_id: mas_n626_guidelines_2025
    family: mas_n626_guidelines
    title: "Guidelines to MAS Notice 626 on Prevention of Money Laundering and Countering the Financing of Terrorism - Banks"
    issuer: MAS
    doc_type: guidelines
    jurisdiction: SG
    version_label: "28 March 2024, last revised on 1 July 2025"   # 下载后对照封面核对
    issued_date: 2025-07-01
    effective_from: 2025-07-01        # 2025 年 6 月 30 日发布的这批修订（通知与指引）自 7 月 1 日生效
    effective_to: null
    source_url: "https://www.mas.gov.sg/regulation/guidelines/guidelines-to-notice-626-on-prevention-of-money-laundering-and-cft-for-banks"
    download_hint: "页面顶部的当前版本 PDF（不是 Amendment Notes 里的旧版链接）"

  - doc_id: mas_tm_guidance
