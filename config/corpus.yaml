# ============================================================================
# SentryAML - 知识库文件清单（RAG 层 R1）
# ============================================================================
# 清单即代码：知识库里有哪些文件、哪个版本、从哪里下载，都写在这里并提交到 git。
# 原始 PDF 不提交（放在 data/corpus/raw/，已被 .gitignore 忽略），
# 别人拿到仓库后按这份清单下载，就能重建出完全相同的知识库。
#
# 下载后的文件名一律用 doc_id：data/corpus/raw/<doc_id>.pdf
#
# 标为 TODO 的字段，需要你打开 PDF 封面或下载页面核对后填写。
# register_corpus.py 会拒绝登记任何还有 TODO 的条目——版本信息必须人工确认过。
#
# 日期约定：
#   effective_from / effective_to 是生效区间 [from, to)，to 为 null 表示仍然有效。
#   研究报告类（FATF、论文）没有"生效"的概念，用发布日期作为 effective_from。
#   只知道月份时，填当月 1 日，并在 version_label 里写原文的月份。
# ============================================================================

documents:

  # --------------------------------------------------------------------------
  # 一、监管义务（新加坡）
  # --------------------------------------------------------------------------
  - doc_id: mas_n626_2024
    family: mas_n626
    title: "MAS Notice 626 Prevention of Money Laundering and Countering the Financing of Terrorism - Banks"
    issuer: MAS
    doc_type: notice
    jurisdiction: SG
    version_label: "28 March 2024"
    issued_date: 2024-03-28
    effective_from: 2024-04-01
    effective_to: 2025-07-01          # 被 2025 年 6 月 30 日的修订版取代
    source_url: "https://www.mas.gov.sg/regulation/notices/notice-626"
    download_hint: "页面上 'MAS Notice 626 (28 Mar 2024)' 那个 PDF"
    optional: true                    # 用来演示版本切换；没下到也不影响主流程

  - doc_id: mas_n626_2025
