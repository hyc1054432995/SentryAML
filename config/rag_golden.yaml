# ============================================================================
# SentryAML - RAG 评测问题集 v1（RAG 层 R4）
# ============================================================================
# 先有评测集，再做检索：之后每加一项技术（混合检索、重排、图扩展、上下文增强），
# 都在这套题上量化"提升了多少"，而不是看几个例子觉得"好像变好了"。
#
# 字段：
#   type         lookup 条款查找 / definition 定义 / exact_id 按编号查 / typology 由场景找风险信号 /
#                str_filing 报送操作 / multi_hop 需要两条以上条款 / version 答案随调查日期变化 / unanswerable 知识库答不了
#   lang         en / zh。中文题都与一道英文题配对，用来量跨语言检索的差距
#   split        dev 开发集：调参、做消融都只看它；test 测试集：最后跑一次
#   as_of        调查日期，默认 default_as_of。只检索这一天有效的文件版本（D45）
#   gold         回答这道题必须用到的条款（文件族 + 编号；版本由 as_of 决定）
#   also_ok      也能回答、检索到不扣分的条款（防止"只标一条正确答案"冤枉其他合理结果）
#   near_miss    看起来相关、但不足以回答或会答错的条款（无答案题、版本题的陷阱）
#   answer_keys  答案要点，必须逐字出现在 gold 原文里（rag_golden_check.py 核对）
#   must_not     版本陷阱：答案里出现它，说明答成了另一个版本
#   group        同组的题必须在同一侧（配对的版本题、共享前提的题）
#
# 切分规则（rag_golden_check.py 强制）：同一条款不能同时是开发集和测试集的 gold。
# 否则在开发集上调参，就等于提前知道了测试集答案在哪。
#
# 修改流程：改这个文件 → python scripts/rag_golden_check.py → 通过后提交 git。
# 测试集一旦用于报告结果就冻结；需要扩充时新建 v2，不改 v1。
# ============================================================================
