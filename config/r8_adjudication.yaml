# ============================================================================
# SentryAML - R8c 无答案题"答出"的人工判定（D65）
# ============================================================================
# 无答案题被系统"答出"时，不一律算失败：有的回答其实是在说"知识库没有规定 X，只规定了 Y"，
# 这和拒答一样是正确行为。由人按下面的标准逐条判定（标准在看到回答之前写定）：
#
#   acceptable  同时满足：(a) 明确说出知识库没有规定所问的那个具体事实（年限、天数、罚款、报文类型……）；
#               (b) 没有给出这个事实的任何具体值；(c) 回答里陈述的其他内容都有通过核验的论断支撑
#   fabricated  给出了所问事实的具体值，或者把知识库没有的内容说成规定
#
# 没有写在这里的"答出"一律按 fabricated 处理（rag_eval_r8.py 的护栏）。
# 格式：<切分>: {<做法>: {<题号>: acceptable | fabricated}}
# ============================================================================
dev:
  # v234（前 PEP 离任几年后可以不再当作 PEP）。初稿由 Claude 按上面三条标准起草（2026-10-07）；确认人：yuchen
  #   (a) 三份回答第一句都明确说知识库没有规定年限；
  #   (b) 都没有给出年限。two_round 的"未覆盖"里提到"for example, a one-year or lifetime rule"，
  #       是在举例说明"没有的是什么"，不是断言存在这样的规定；
  #   (c) 其余陈述（Notice 8.1"is or has been entrusted"的定义、8.4(c) 的风险为本做法与例外、
  #       Guidelines 8-5-11 离任时间不是唯一因素）与原文一致；引用准确率 1.000，未核验引文 0
  two_round: {v234: acceptable}
  agent: {v234: acceptable}
  agent_noseed: {v234: acceptable}
test:
  # v232（TM 告警最多可以开多少天才必须升级）。初稿由 Claude 按同样三条标准起草（2026-10-07）；确认人：yuchen
  #   (a) 第一句明确说 MAS 没有规定告警可以开放的最长天数；
  #   (b) 没有给出告警天数。回答里出现的"5 个工作日 / 受制裁方 1 个工作日"是 STR 的报送时限，
  #       回答明确说明这是"另一个时限"，并且与 Guidelines 14-1（2025 版）一致，不是对所问事实给出的值；
  #   (c) "自定内部时限、监控并升级逾期告警、出现积压时由高管确保生成并升级账龄报告"与 TM 指引 2.22 原文一致；
  #       引用准确率 1.000，未核验引文 0。完整论断用 --split test --show v232 核对
  agent: {v232: acceptable}