instructions:
- 'supported: true only if EVERY claim in the sentence follows from the evidence. ''numbers'' shows where each number
  comes from, but a sentence can have correct numbers and still say too much.'
- 'Mark supported: false when the sentence adds a conclusion that nothing measured, e.g. ''no funds were retained''
  (only one matched pair was checked), ''not explained by the business type'' (no business type is recorded), ''purpose-built
  relationship'', or a count read from a truncated list.'
- 'The hardest cases have every number right: two different measurements joined into one story (e.g. the 4 counterparties
  of all outflows described as where the matched pass-through funds went), or an observation from a limited window
  stated as the whole history (''no earlier activity'' when only 7 days were checked). Mark these false too.'
- Write the reason in note for every false.
- 'The three questions per item: true = good. flow_of_funds_clear: a reader can follow where the money came from
  and went. why_suspicious_explained: the text says why this is unusual, not only what happened. weak_signals_not_overstated:
  weak signals (first contact alone, one fan count, amount size) are not presented as proof.'
- Do not change the text.
